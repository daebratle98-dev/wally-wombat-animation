
name: AI Agents - Generate Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run four AI agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SHORT_TOPIC: Why wombats produce cube-shaped poop
        run: node agents.js

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agents-output
          path: agent-output/
          if-no-files-found: warn
