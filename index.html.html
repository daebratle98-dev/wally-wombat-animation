<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wally the Wombat - Scene 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #stage {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            position: relative;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="stage">
        <svg viewBox="0 0 1080 1920" id="anim-svg">
            <!-- Definitions for gradients and shadows -->
            <defs>
                <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8FBC8F" />
                    <stop offset="100%" stop-color="#228B22" />
                </linearGradient>
                <linearGradient id="wallyBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#A0522D" />
                    <stop offset="100%" stop-color="#8B5A2B" />
                </linearGradient>
                <linearGradient id="wallyBelly" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#F5DEB3" />
                    <stop offset="100%" stop-color="#D2B48C" />
                </linearGradient>
                <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="15" stdDeviation="10" flood-opacity="0.2"/>
                </filter>
            </defs>

            <!-- Background Elements: Outback Sun & Landscape -->
            <circle cx="540" cy="400" r="180" fill="#FFD700" opacity="0.8" />
            
            <!-- Far Hills -->
            <path d="M 0 1200 Q 300 1050 540 1200 T 1080 1150 L 1080 1920 L 0 1920 Z" fill="#A2D9CE" />

            <!-- Group for Camera Zoom Container -->
            <g id="camera-zoom" transform="translate(540, 1400) scale(1) translate(-540, -1400)">

                <!-- Bush Back Layer -->
                <path d="M 200 1300 Q 150 1100 350 1050 Q 450 1000 550 1080 Q 700 980 850 1080 Q 980 1120 900 1300 Z" fill="#2E8B57" filter="url(#dropShadow)" />

                <!-- WALLY THE WOMBAT RIG -->
                <g id="wally-root" transform="translate(540, 1300)">
                    
                    <!-- Left Arm (Behind Body) -->
                    <g id="wally-left-arm" transform="translate(-110, 50)">
                        <rect x="-30" y="0" width="50" height="120" rx="25" fill="#8B5A2B" filter="url(#dropShadow)"/>
                    </g>

                    <!-- Torso & Belly -->
                    <g id="wally-torso" filter="url(#dropShadow)">
                        <ellipse cx="0" cy="80" rx="150" ry="170" fill="url(#wallyBody)" />
                        <ellipse cx="0" cy="90" rx="100" ry="120" fill="url(#wallyBelly)" />
                    </g>

                    <!-- Right Arm (Waving) -->
                    <g id="wally-right-arm" transform="translate(110, 30)">
                        <rect x="-20" y="0" width="50" height="120" rx="25" fill="#8B5A2B" transform="rotate(0, -20, 0)" transform-origin="0 20" />
                    </g>

                    <!-- Head Group -->
                    <g id="wally-head" transform="translate(0, -90)">
                        <!-- Ears -->
                        <g id="wally-ears">
                            <ellipse cx="-80" cy="-60" rx="35" ry="50" fill="#8B5A2B" transform="rotate(-25 -80 -60)" />
                            <ellipse cx="-80" cy="-60" rx="20" ry="35" fill="#FFC0CB" transform="rotate(-25 -80 -60)" />
                            
                            <ellipse cx="80" cy="-60" rx="35" ry="50" fill="#8B5A2B" transform="rotate(25 80 -60)" />
                            <ellipse cx="80" cy="-60" rx="20" ry="35" fill="#FFC0CB" transform="rotate(25 80 -60)" />
                        </g>

                        <!-- Head Base -->
                        <ellipse cx="0" cy="0" rx="110" ry="95" fill="url(#wallyBody)" filter="url(#dropShadow)" />

                        <!-- Snout -->
                        <g id="wally-snout" transform="translate(0, 20)">
                            <ellipse cx="0" cy="15" rx="65" ry="45" fill="#CD853F" />
                            <ellipse cx="0" cy="-5" rx="45" ry="25" fill="#222222" filter="url(#dropShadow)" /> <!-- Big Black Button Nose -->
                        </g>

                        <!-- Eyes -->
                        <g id="wally-eyes">
                            <!-- Left Eye -->
                            <g id="left-eye">
                                <circle cx="-45" cy="-20" r="14" fill="#FFFFFF" />
                                <circle cx="-43" cy="-20" r="6" fill="#000000" id="left-pupil" transform-origin="-43 -20" />
                                <path id="left-blink" d="M -60 -20 Q -45 -35 -30 -20" stroke="#222222" stroke-width="4" fill="none" opacity="0" />
                            </g>
                            <!-- Right Eye -->
                            <g id="right-eye">
                                <circle cx="45" cy="-20" r="14" fill="#FFFFFF" />
                                <circle cx="43" cy="-20" r="6" fill="#000000" id="right-pupil" transform-origin="43 -20" />
                                <path id="right-blink" d="M 30 -20 Q 45 -35 60 -20" stroke="#222222" stroke-width="4" fill="none" opacity="0" />
                            </g>
                        </g>

                        <!-- Mouth (Smile) -->
                        <path id="wally-mouth" d="M -20 60 Q 0 80 20 60" stroke="#4A3525" stroke-width="5" fill="none" stroke-linecap="round" />
                    </g>
                </g>

                <!-- Bush Front Layer (Overlaps lower body during pop-up) -->
                <path d="M 0 1400 Q 150 1200 400 1250 Q 600 1150 800 1260 Q 1000 1200 1080 1400 L 1080 1920 L 0 1920 Z" fill="url(#groundGrad)" filter="url(#dropShadow)" />

                <!-- Floating Geometric Square Icon -->
                <g id="icon-group" transform="translate(540, 950) scale(0)">
                    <rect x="-75" y="-75" width="150" height="150" rx="25" fill="#00BFFF" opacity="0.9" filter="url(#dropShadow)" />
                    <!-- Inner geometric line art -->
                    <rect x="-45" y="-45" width="90" height="90" rx="10" fill="none" stroke="#FFFFFF" stroke-width="8" />
                </g>

            </g>
        </svg>
    </div>

    <script>
        // Deterministic Animation Controller
        function setProgress(t) {
            // Clamp t between 0.0 and 4.0
            t = Math.max(0, Math.min(4, t));

            const wallyRoot = document.getElementById('wally-root');
            const rightArm = document.getElementById('wally-right-arm');
            const iconGroup = document.getElementById('icon-group');
            const cameraZoom = document.getElementById('camera-zoom');
            const leftBlink = document.getElementById('left-blink');
            const rightBlink = document.getElementById('right-blink');
            const leftPupil = document.getElementById('left-pupil');
            const rightPupil = document.getElementById('right-pupil');

            // 1. 0.0 - 0.6s: Spring upward with back-out easing
            let translateY = 300; // Hidden behind bush
            let scaleY = 1;
            let scaleX = 1;

            if (t <= 0.6) {
                let p = t / 0.6;
                let easeP = 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2);
                if (p >= 1) easeP = 1;
                translateY = 300 * (1 - easeP);
                
                if (p < 0.2) {
                    scaleY = 0.8;
                    scaleX = 1.2;
                } else if (p < 0.4) {
                    scaleY = 1.15;
                    scaleX = 0.9;
                } else {
                    scaleY = 1.0;
                    scaleX = 1.0;
                }
            } else {
                translateY = 0;
            }
            wallyRoot.setAttribute('transform', `translate(540, ${1300 + translateY}) scale(${scaleX}, ${scaleY})`);

            // 2. 0.6 - 2.0s: Waving right arm & blinking
            let armRot = 0;
            if (t >= 0.6 && t <= 2.0) {
                let waveProgress = (t - 0.6) / 1.4;
                armRot = -45 + Math.sin(waveProgress * Math.PI * 6) * 35;
            } else if (t > 2.0) {
                armRot = -20;
            }
            rightArm.setAttribute('transform', `translate(110, 30) rotate(${armRot}, 0, 20)`);

            // Blinking logic (natural blink at ~1.2s)
            let blinkOpacity = 0;
            let pupilScale = 1;
            if (t >= 1.1 && t <= 1.25) {
                blinkOpacity = 1;
                pupilScale = 0;
            }
            leftBlink.setAttribute('opacity', blinkOpacity);
            rightBlink.setAttribute('opacity', blinkOpacity);
            leftPupil.setAttribute('transform', `scale(${pupilScale})`);
            rightPupil.setAttribute('transform', `scale(${pupilScale})`);

            // 3. 2.0 - 3.2s: Glowing square pops up, scales up, overshoots, and settles
            let iconScale = 0;
            if (t >= 2.0 && t <= 3.2) {
                let ip = (t - 2.0) / 1.2;
                if (ip < 1) {
                    let sEase = 1 + 2.5 * Math.pow(ip - 1, 3) + 1.5 * Math.pow(ip - 1, 2);
                    if (ip >= 1) sEase = 1;
                    iconScale = sEase;
                } else {
                    iconScale = 1.0;
                }
            } else if (t > 3.2) {
                iconScale = 1.0;
            }
            iconGroup.setAttribute('transform', `translate(540, 900) scale(${iconScale})`);

            // 4. 3.2 - 4.0s: Subtle camera zoom-in
            let zoom = 1.0;
            if (t >= 3.2) {
                let zp = (t - 3.2) / 0.8;
                zoom = 1.0 + (zp * 0.08);
            }
            cameraZoom.setAttribute('transform', `translate(540, 1400) scale(${zoom}) translate(-540, -1400)`);
        }

        // Automatic Browser Playback Loop (4-second looping preview)
        let startTime = null;
        const totalDuration = 4.0;

        function browserPlaybackLoop(timestamp) {
            if (!startTime) startTime = timestamp;
            let elapsedSec = (timestamp - startTime) / 1000;
            
            // Loop back to 0 after 4 seconds
            let currentT = elapsedSec % totalDuration;
            
            setProgress(currentT);
            requestAnimationFrame(browserPlaybackLoop);
        }

        requestAnimationFrame(browserPlaybackLoop);
    </script>
</body>
</html>
